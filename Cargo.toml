[package]
name = "soilmotif"
version = "0.2.0"
edition = "2021"
authors = ["Andrew G. Brown <brown.andrewg@gmail.com>"]
license = "GPL (>= 3)"

[dependencies]
extendr-api = "0.8"
ndarray = "0.15"
nalgebra = "0.33"
argmin = { version = "0.9", features = ["serde"] }
rayon = "1.8"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }

[features]
# Feature flags for batch processing parallelization
# - default: includes rayon-support for multi-core batch optimization
# - rayon-support: enables rayon-based data parallelism
# - tokio-support: enables tokio async (exploratory for future I/O-bound workloads)
# - full-parallel: enables both rayon and tokio
default = ["rayon-support"]
rayon-support = []
tokio-support = []
full-parallel = ["rayon-support", "tokio-support"]

[lib]
name = "soilmotif"
crate-type = ["staticlib"]

[profile.release]
opt-level = 3
lto = true
